<div class="flex flex-wrap items-center gap-2">
  <span
    class="inline-flex items-center gap-1 rounded-full border px-2 py-0.5 text-xs font-medium"
    [class.border-accent]="stage() === 'published'"
    [class.text-accent]="stage() === 'published'"
    [class.border-muted-foreground]="stage() !== 'published'"
    [class.text-muted-foreground]="stage() !== 'published'"
  >
    <span aria-hidden="true">{{ stage() === 'published' ? '●' : '○' }}</span>
    Etapa: {{ stageLabel() }}
  </span>
</div>
