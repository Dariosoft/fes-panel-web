<div class="pointer-events-none fixed right-4 bottom-4 z-30 flex flex-col items-end gap-3 sm:right-6 sm:bottom-6">
  <div
    id="floating-menu-items"
    class="flex flex-col-reverse items-end gap-3"
    [class.pointer-events-auto]="open()"
    [attr.aria-hidden]="!open()"
    [attr.inert]="open() ? null : ''"
  >
    @for (item of items(); track item.id; let i = $index) {
      <div
        class="flex items-center gap-2 transition duration-200 ease-out motion-reduce:transition-none"
        [class.translate-y-2]="!open()"
        [class.opacity-0]="!open()"
        [style.transition-delay]="open() ? i * 40 + 'ms' : '0ms'"
      >
        <span
          class="rounded-md border border-border bg-card px-3 py-2 text-sm font-medium whitespace-nowrap text-foreground shadow-md"
        >
          {{ item.label }}
        </span>
        <button
          type="button"
          class="inline-flex size-11 shrink-0 items-center justify-center rounded-full border border-border bg-card text-foreground shadow-md transition-colors duration-200 ease-out hover:bg-muted focus-visible:outline-none focus-visible:inset-ring-2 focus-visible:inset-ring-ring motion-reduce:transition-none aria-disabled:cursor-not-allowed aria-disabled:opacity-50"
          [attr.aria-disabled]="item.disabled ? true : null"
          [title]="item.label"
          (click)="select(item)"
        >
          <lucide-icon [img]="item.icon" [size]="18" aria-hidden="true" />
        </button>
      </div>
    }
  </div>

  <button
    type="button"
    class="pointer-events-auto inline-flex size-14 items-center justify-center rounded-full bg-accent text-on-accent shadow-lg transition-[background-color,transform] duration-200 ease-out hover:bg-accent/90 focus-visible:outline-none focus-visible:inset-ring-2 focus-visible:inset-ring-ring motion-reduce:transition-none"
    aria-controls="floating-menu-items"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="open() ? closeLabel() : menuLabel()"
    [title]="open() ? closeLabel() : menuLabel()"
    (click)="toggle()"
  >
    <lucide-icon [img]="open() ? closeIcon() : icon()" [size]="24" aria-hidden="true" />
  </button>
</div>
