@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4">
    <div
      #panel
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title()"
      tabindex="-1"
      class="w-full max-w-md rounded-lg border border-border bg-card p-5 text-card-foreground shadow-xl focus:outline-none"
      (keydown)="onKeydown($event)"
    >
      <h2 class="font-mono text-lg font-medium text-foreground">{{ title() }}</h2>
      <p class="mt-2 text-sm leading-6 text-muted-foreground">{{ message() }}</p>

      <div class="mt-5 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
        <button
          type="button"
          class="inline-flex min-h-11 items-center justify-center rounded-md border border-border px-4 text-sm font-medium text-foreground transition-colors duration-200 ease-out hover:bg-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring motion-reduce:transition-none"
          (click)="cancel()"
        >
          {{ cancelLabel() }}
        </button>
        <button
          type="button"
          class="inline-flex min-h-11 items-center justify-center rounded-md px-4 text-sm font-medium transition-colors duration-200 ease-out focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring motion-reduce:transition-none"
          [class]="confirmClasses()"
          (click)="confirm()"
        >
          {{ confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
}
