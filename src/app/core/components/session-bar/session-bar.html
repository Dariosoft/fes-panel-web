<div class="flex flex-col gap-3 font-sans" [ngClass]="collapsed() ? 'md:items-center' : ''">
  @if (authenticated()) {
    <div class="flex flex-col gap-1" [ngClass]="collapsed() ? 'md:hidden' : ''">
      <p class="text-sm font-medium break-words text-foreground">{{ name() }}</p>
      <p class="text-xs break-words text-muted-foreground">{{ email() }}</p>
    </div>
    <button
      type="button"
      class="inline-flex min-h-11 w-full cursor-pointer items-center gap-2 rounded-md border border-border bg-transparent px-3 text-sm font-medium text-foreground transition-colors duration-200 ease-out hover:bg-muted focus-visible:outline-none focus-visible:inset-ring-2 focus-visible:inset-ring-ring motion-reduce:transition-none"
      [ngClass]="collapsed() ? 'md:justify-center md:px-0' : ''"
      [attr.aria-label]="collapsed() ? 'Salir' : null"
      [title]="collapsed() ? 'Salir' : ''"
      (click)="logout.emit()"
    >
      <lucide-icon [img]="logoutIcon" [size]="18" aria-hidden="true" />
      <span [ngClass]="collapsed() ? 'md:hidden' : ''">Salir</span>
    </button>
  } @else {
    <button
      type="button"
      class="inline-flex min-h-11 w-full cursor-pointer items-center gap-2 rounded-md bg-accent px-3 text-sm font-medium text-on-accent transition-colors duration-200 ease-out hover:bg-accent/90 focus-visible:outline-none focus-visible:inset-ring-2 focus-visible:inset-ring-ring motion-reduce:transition-none"
      [ngClass]="collapsed() ? 'md:justify-center md:px-0' : ''"
      [attr.aria-label]="collapsed() ? 'Entrar con Google' : null"
      [title]="collapsed() ? 'Entrar con Google' : ''"
      (click)="enterWithGoogle.emit()"
    >
      <lucide-icon [img]="loginIcon" [size]="18" aria-hidden="true" />
      <span [ngClass]="collapsed() ? 'md:hidden' : ''">Entrar con Google</span>
    </button>
  }

  @if (notice()) {
    <p
      class="rounded-md border border-destructive bg-card px-3 py-2 text-sm leading-5 text-foreground"
      role="alert"
    >
      {{ notice() }}
    </p>
  }
</div>
