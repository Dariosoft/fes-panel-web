<div
  class="relative h-28 w-28 shrink-0 overflow-hidden rounded-md border border-white/20 bg-background sm:h-36 sm:w-36"
>
  @if (source()) {
    <img [src]="source()" [alt]="alt()" class="h-full w-full object-cover" />
  }

  @if (hasMany()) {
    <div
      class="absolute inset-x-0 bottom-0 flex items-center justify-between gap-1 bg-black/50 px-1 py-0.5"
    >
      <button
        type="button"
        class="inline-flex size-7 items-center justify-center rounded text-on-primary hover:bg-white/10 focus-visible:outline-none focus-visible:inset-ring-2 focus-visible:inset-ring-ring"
        aria-label="Imagen anterior"
        (click)="previous()"
      >
        ‹
      </button>
      <span class="text-xs text-on-primary">{{ indexLabel() }}</span>
      <button
        type="button"
        class="inline-flex size-7 items-center justify-center rounded text-on-primary hover:bg-white/10 focus-visible:outline-none focus-visible:inset-ring-2 focus-visible:inset-ring-ring"
        aria-label="Imagen siguiente"
        (click)="next()"
      >
        ›
      </button>
    </div>
  }
</div>
