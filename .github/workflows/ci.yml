# Validates every pull request into dev or main. A single `npm run verify` runs
# ESLint (TypeScript and templates), the Vitest suite with coverage and an 80%
# line gate, and the production build.
#
# On pushes to dev or main it also publishes the SonarQube Cloud analysis, which
# reuses coverage/panel-web/lcov.info generated by the previous step. SonarQube
# Cloud follows the GitHub default branch, which is dev: that is the project's
# main branch and the one shown on the Overview dashboard.
#
# Requirements before the SonarQube step can run:
# - Organization secret SONAR_TOKEN with a SonarQube Cloud token (Dariosoft org,
#   Actions secrets, shared with this repository).
# - Automatic Analysis disabled for the fes-panel-web project: SonarQube Cloud
#   rejects CI-based analysis while it is enabled.
#
# Dependency vulnerabilities and secrets are reported, not enforced yet: set
# exit-code to '1' on the Trivy steps to fail the job on findings.
#
# The local secret guard is the versioned pre-commit hook in .githooks: enable it
# with `git config core.hooksPath .githooks`.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify panel-web
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint, tests, coverage gate and build
        run: npm run verify

      - name: Generate SBOM
        # Trivy accepts CycloneDX up to 1.6; cyclonedx-npm 7 defaults to 1.7.
        run: npx --no-install cyclonedx-npm --output-file bom.json --spec-version 1.6

      - name: Dependency vulnerability report (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: sbom
          scan-ref: bom.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'

      - name: Secret scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '0'
          skip-dirs: node_modules,dist,coverage,.git

      - name: SonarQube Cloud analysis
        #if: github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-scan-action@v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
